<!DOCTYPE html>
<html lang="zh-CN" data-proto-page="app-p1" data-proto-state="default" data-proto-preview="mobile">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学案详情 - 学生App</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#2f7de1;--red:#ff4d4f;--yellow:#f5a623;--ink:#262626;--ink2:#595959;--muted:#8c8c8c;--line:#ededed}
html,body{min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#e9ebee;display:flex;justify-content:center;padding:24px 0;color:var(--ink);-webkit-font-smoothing:antialiased}
.phone{width:390px;height:844px;background:#fff;border-radius:38px;box-shadow:0 10px 40px rgba(0,0,0,.22),0 0 0 9px #14161a;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.screen{flex:1;overflow-y:auto;background:#fff}
.screen::-webkit-scrollbar{width:0}

/* 状态栏 */
.statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 30px;font-size:14px;font-weight:600;flex-shrink:0;background:#fff}
.sb-icons{display:flex;align-items:center;gap:5px}

/* 导航栏 */
.navbar{height:48px;display:flex;align-items:center;padding:0 14px;background:#fff;flex-shrink:0}
.nav-back{width:32px;height:32px;border-radius:50%;background:#f2f3f5;display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--ink);cursor:pointer;flex-shrink:0}
.nav-title{flex:1;text-align:center;font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px}

/* 成绩行 */
.score-line{display:flex;align-items:center;padding:12px 16px;font-size:13px;color:var(--ink)}
.score-line .sl-yj{margin-left:auto;color:var(--blue);cursor:pointer;font-size:13px}

/* 区块 */
.sec{padding:6px 0 4px;border-top:8px solid #f6f7f9}
.sec:first-child{border-top:0}
.sec-head{display:flex;align-items:center;padding:10px 16px 6px;font-size:14.5px;font-weight:600}
.sec-head::before{content:'';width:3.5px;height:15px;background:var(--blue);border-radius:2px;margin-right:7px}
.sec-head .sh-right{margin-left:auto;font-size:11.5px;font-weight:400;color:var(--ink2);display:flex;align-items:center;gap:5px}
.sh-right .yl{width:11px;height:11px;background:var(--yellow);border-radius:2px;display:inline-block}
.sec-sub{padding:0 16px 2px;font-size:11px;color:var(--muted)}
.chart{padding:4px 8px 0}

/* 答题情况 */
.aq-head{display:flex;align-items:center;padding:10px 16px 8px;font-size:14.5px;font-weight:600}
.aq-head::before{content:'';width:3.5px;height:15px;background:var(--blue);border-radius:2px;margin-right:7px}
.aq-right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12px;font-weight:400}
.aq-right .chkbox{display:flex;align-items:center;gap:5px;color:var(--ink);cursor:pointer;user-select:none}
.aq-right .chkbox i{width:14px;height:14px;border:1.5px solid #c7ccd4;border-radius:2px;display:inline-block}
.aq-right .bycol{color:var(--blue);cursor:pointer}

/* 题目行 */
.q-row{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px}
.q-row.col{flex-direction:column;align-items:stretch;gap:8px;padding:12px 16px 10px}
.q-line1{display:flex;align-items:center;gap:8px}
.q-line1 .q-name{color:var(--ink);white-space:nowrap}
.q-line1 .q-ans{color:var(--ink);white-space:nowrap}
.q-line1 .q-mine{margin-left:auto;color:var(--ink);white-space:nowrap;font-size:13px}
.q-line1 .q-mine.wrong b{color:var(--red)}
.q-line1 .q-mine b{font-weight:600}
.q-line2{display:flex;justify-content:flex-end}
.q-row .q-name{color:var(--ink);white-space:nowrap}
.q-row .q-ans{color:var(--ink);white-space:nowrap}
.q-row .q-mine{margin-left:auto;color:var(--ink);white-space:nowrap;font-size:13px}
.q-row .q-mine.wrong b{color:var(--red)}
.q-row .q-mine b{font-weight:600}

/* 讲解开关 */
.sw{display:inline-flex;align-items:center;gap:5px;flex-shrink:0}
.sw-txt{font-size:11.5px;color:#9aa0a6}
.sw-txt.on{color:var(--blue)}
.sw-tg{width:30px;height:17px;border-radius:9px;background:#c7ccd4;position:relative;cursor:pointer;transition:background .15s;flex-shrink:0}
.sw-tg.on{background:var(--blue)}
.sw-tg::after{content:'';position:absolute;width:13px;height:13px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw-tg.on::after{left:15px}

/* 手写作答纸 */
.paper{margin:2px 16px 14px;background:#fff;border:1px solid #e5e6eb;border-radius:4px;padding:10px 12px;position:relative;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 23px,#eef0f4 23px,#eef0f4 24px)}
.paper .pp{font-size:12px;color:#3a3f47;line-height:24px}
.paper .pp .hand{font-family:'Kaiti SC','STKaiti','楷体',cursive;color:#31488f;font-size:13.5px}
.paper .pp .hand-circle{font-family:'Kaiti SC','STKaiti','楷体',cursive;color:#31488f;font-size:13.5px;border:1.4px solid #31488f;border-radius:50%;padding:0 3px}
.paper .pp .ind{color:#9aa0a6;font-size:11px}
.paper .red-check{position:absolute;top:6px;right:10px;width:34px;height:34px}

.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(8px);background:rgba(0,0,0,.78);color:#fff;font-size:12.5px;padding:8px 16px;border-radius:6px;opacity:0;transition:all .25s;pointer-events:none;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* proto-host-device */
html[data-proto-host],html[data-proto-host] body{height:100%;min-height:0}
html[data-proto-host] body{padding:0;background:#fff;display:block}
html[data-proto-host] .phone{width:100%;height:100dvh;max-width:none;border-radius:0;box-shadow:none}
html[data-proto-host] .statusbar{display:none}
</style>

    + '(1) 请列举你知道的常见的漂白剂：<span class="hand">NaClO、HClO、Ca(ClO)₂</span><br>'
    + '(2) 氯水和二氧化硫的水溶液都有漂白性，若将二者混合，漂白性会增强吗？<span class="hand">不会</span>（填“会”或“不会”），并说明原因：<span class="hand">氯气具有强氧化性，二氧化硫具有还原性，二者混合发生反应，漂白性消失</span>'
    + '</div><svg class="red-check" viewBox="0 0 34 34"><path d="M8 18l7 7L27 9" stroke="#ff4d4f" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
}

/* ═══════ 开关交互 ═══════ */
function toggleNeed(id) {
  NEED[id] = !NEED[id];
  document.getElementById('swg-' + id).classList.toggle('on', NEED[id]);
  const t = document.getElementById('swt-' + id);
  t.textContent = NEED[id] ? '需要讲解' : '不需讲解';
  t.classList.toggle('on', NEED[id]);
  toast(NEED[id] ? '已标记为需要讲解，老师将重点讲解本题' : '已取消讲解标记');
}

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toastEl');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

        if (!pop || e.button !== 0) return;
        e.preventDefault(); e.stopPropagation();
        const rect = pop.getBoundingClientRect(), startX = e.clientX, startW = rect.width, fixedRight = rect.right;
        popResizing = { handle, side, pointerId: e.pointerId };
        pop.classList.add('pop-resizing');
        document.documentElement.style.cursor = 'ew-resize';
        document.documentElement.style.userSelect = 'none';
        // 指针按下后由 window 兜住整段拖动；不依赖鼠标始终停留在 12px 边缘热区，也不依赖 pointer capture 是否成功。
        try { handle.setPointerCapture(e.pointerId); } catch (_) { /* 浏览器不支持时 window 监听仍可工作 */ }
        const move = ev => {
            if (!popResizing || ev.pointerId !== e.pointerId) return;
            ev.preventDefault();
            const raw = side === 'e' ? startW + (ev.clientX - startX) : startW - (ev.clientX - startX);
            const minW = Math.min(280, innerWidth - 16), maxW = Math.max(minW, Math.min(720, innerWidth - 16));
            const edgeMax = side === 'e' ? innerWidth - rect.left - 8 : fixedRight - 8;
            const width = Math.max(minW, Math.min(Math.round(raw), maxW, edgeMax));
            pop.style.width = width + 'px';
            if (side === 'w') pop.style.left = Math.max(8, fixedRight - width) + 'px';
        };
        const up = ev => {
            if (!popResizing || ev.pointerId !== e.pointerId) return;
            popResizing = null; pop.classList.remove('pop-resizing');
            document.documentElement.style.cursor = '';
            document.documentElement.style.userSelect = '';
            window.removeEventListener('pointermove', move, true); window.removeEventListener('pointerup', up, true); window.removeEventListener('pointercancel', up, true);
            try { if (handle.hasPointerCapture(e.pointerId)) handle.releasePointerCapture(e.pointerId); } catch (_) { /* ignore */ }
        };
        window.addEventListener('pointermove', move, { capture: true, passive: false });
        window.addEventListener('pointerup', up, true);
        window.addEventListener('pointercancel', up, true);
    }
    function ensurePop() {
        if (pop) return;
        pop = document.createElement('div');
        pop.id = '__review_popover'; pop.className = '__review_pop';
        pop.setAttribute('role', 'dialog');
        pop.setAttribute('data-prototype-owned', '');
        pop.addEventListener('click', e => e.stopPropagation());
        popBody = document.createElement('div'); popBody.className = '__review_pop_body';
        pop.appendChild(popBody);
        for (const side of ['w', 'e']) {
            const handle = document.createElement('span');
            handle.className = `__review_pop_resize __review_pop_resize_${side}`;
            handle.setAttribute('aria-hidden', 'true'); handle.title = '拖动调节宽度';
            handle.onpointerdown = e => startPopResize(e, handle, side);
            pop.appendChild(handle);
        }
        document.documentElement.appendChild(pop);
    }
    function showPop(note, pin) {
        ensurePop();
        setPinExpanded(popNoteId, false);
        popNoteId = note.id;
        pin.setAttribute('aria-expanded', 'true');
        popBody.innerHTML = R.renderBody ? R.renderBody(note) : (note.body || '');
        popBody.scrollTop = 0;
        pop.style.display = 'block';
        pop.style.visibility = 'hidden';
        pop.style.left = '0px'; pop.style.top = '0px';
        const pw = pop.offsetWidth, ph = pop.offsetHeight;
        const px = parseFloat(pin.style.left) || 0, py = parseFloat(pin.style.top) || 0;
        const W = innerWidth, H = innerHeight;
        let left = px + 16, top = py - ph - 8;
        if (left + pw > W - 8) left = px - pw - 16;
        left = Math.max(8, Math.min(left, W - pw - 8));
        if (top < 8) top = py + 8;
        top = Math.max(8, Math.min(top, H - ph - 8));
        pop.style.left = left + 'px'; pop.style.top = top + 'px';
        pop.style.visibility = 'visible';
    }
    function togglePop(note, pin) {
        if (pop && pop.style.display === 'block' && popNoteId === note.id) { hidePop(); return; }
        showPop(note, pin);
    }
    window.__reviewHidePop = hidePop;
    window.__reviewPopNoteId = () => (pop && pop.style.display === 'block' ? popNoteId : null);
    window.__reviewRelayout = () => { try { layout(); } catch (_) { /* ignore */ } };
    document.addEventListener('click', e => {
        if (pop && pop.style.display === 'block' && !pop.contains(e.target) && !e.target.closest?.('.__review_pin')) hidePop();
    }, true);
    // scroll 监听用了 capture，气泡自身 overflow:auto 的滚动也会冒到 window；旧逻辑因此鼠标一滚正文就关气泡。
    // 只在气泡外部（原型页面 / 其他滚动容器）发生滚动时关闭；气泡内部滚动保持打开。
    window.addEventListener('scroll', e => {
        if (pop && pop.style.display === 'block' && pop.contains(e.target)) return;
        hidePop();
        scheduleLayout();
    }, { passive: true, capture: true });
    window.addEventListener('resize', () => { hidePop(); scheduleLayout(); }, { passive: true });

    let layoutFrame = 0;
    function scheduleLayout() {
        if (layoutFrame) return;
        layoutFrame = requestAnimationFrame(() => { layoutFrame = 0; layout(); });
    }

    const stateOf = () => document.documentElement.dataset.protoState || 'default';
    let lastState = '', lastX = -1, lastY = -1, lastW = 0, lastH = 0, lastHtml = '';
    let lastOrder = '', lastStale = '';

    function layout() {
        const state = stateOf();
        if (state !== lastState) hidePop(); // 只在原型状态切换时关气泡；纯几何重排不关（避免侧栏收起引发的 reflow 误关刚弹出的气泡）
        const notes = (R.notes || []).filter(n => n.stateId === state);
        const arranged = window.ProtoOrder.project(notes, window);
        const stale = [], noPoint = [];
        layer.replaceChildren();
        for (const n of arranged) {
            let found = null;
            try { found = window.ProtoAnchors.point(n); } catch (_) { /* 锚定异常按失效处理 */ }
            if (!found?.point) { noPoint.push(n); continue; }
            if (found.point.visible === false) continue; // 滚出嵌套容器的序号随锚点隐藏，不算失锚。
            const pin = document.createElement('button');
            pin.type = 'button';
            pin.className = '__review_pin';
            window.ProtoAppearance?.applyPin(pin, n);
            pin.dataset.noteId = n.id;
            pin.textContent = n.displayNumber;
            pin.setAttribute('aria-label', `标注 ${n.displayNumber}`);
            pin.setAttribute('aria-haspopup', 'dialog');
            pin.setAttribute('aria-controls', '__review_popover');
            pin.setAttribute('aria-expanded', String(popNoteId === n.id && pop?.style.display === 'block'));
            pin.style.left = found.point.x + 'px';
            pin.style.top = found.point.y + 'px';
            pin.onclick = e => {
                e.preventDefault(); e.stopPropagation();
                // PRD 侧栏展开：定位到右栏对应内容；收起：就地弹气泡展示内容。
                if (R.asideOpen && R.asideOpen()) { hidePop(); R.onFocus?.(n.id); }
                else togglePop(n, pin);
            };
            layer.appendChild(pin);
        }
        // 无落点分流（Feature 1 引导 + 失锚判定）：元素还在且被折叠/隐藏 → 正常颜色，可展开的盖透明脉冲描边框引导；
        // 元素真找不到、或可见但落点失效（目标变化）才算失锚（右栏灰显、置底、不可点）。
        const groups = new Map();
        for (const n of noPoint) {
            let el = null; try { el = window.ProtoAnchors.resolveHidden(n.anchor); } catch (_) { /* ignore */ }
            let hint = null;
            try { hint = window.ProtoAnchors.revealHint?.(n.anchor, el); } catch (_) { /* ignore */ }
            if (!hint && el && window.ProtoAnchors.hidden(el)) {
                let trigger = null; try { trigger = window.ProtoAnchors.revealTrigger(el); } catch (_) { /* ignore */ }
                if (trigger) hint = { trigger, target: el, label: '展开', kind: 'disclosure' };
            }
            if (!hint?.trigger) {
                if (!el || !window.ProtoAnchors.hidden(el)) stale.push(n.id); // 元素仍在但隐藏、只是暂无可操作引导时也不算失锚
                continue;
            }
            let g = groups.get(hint.trigger);
            const actionKey = `${hint.kind}\n${hint.label}`;
            if (!g) groups.set(hint.trigger, (g = { target: hint.target, label: hint.label, actionKey, notes: [] }));
            if (g.actionKey === actionKey) g.notes.push(n);
        }
        const GICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
        const existing = [...glayer.querySelectorAll('.__review_guide')];
        const alive = new Set();
        let gi = existing.length;   // 新建引导错峰呼吸（与 proto-annotate.js 一致）：负 delay 立处不同相位
        groups.forEach((g, trig) => {
            const r = trig.getBoundingClientRect();
            if (r.width === 0 && r.height === 0) return;
            // 描边框套在触发器外 4px，小图标至少 22px 保证可点；裁到视口内，完全出视口就不画（与 proto-annotate.js layoutGuides 同算法）
            const pad = 4, w = Math.max(r.width + pad * 2, 22), h = Math.max(r.height + pad * 2, 22);
            let left = r.left + r.width / 2 - w / 2, top = r.top + r.height / 2 - h / 2;
            const right = Math.min(innerWidth - 2, left + w), bottom = Math.min(innerHeight - 2, top + h);
            left = Math.max(2, left); top = Math.max(2, top);
            if (right - left < 8 || bottom - top < 8) return;
            let guide = existing.find(x => x.__rvTrig === trig);
            if (!guide) {
                guide = document.createElement('button');
                guide.type = 'button'; guide.className = '__review_guide';
                guide.__rvTrig = trig;
                guide.style.setProperty('--g-delay', (-(gi++ % 4) * 0.45) + 's');
                guide.onclick = async e => { e.preventDefault(); e.stopPropagation(); try { await window.ProtoAnchors.revealAndWait(guide.__rvTarget); } catch (_) { /* ignore */ } layout(); };
                glayer.appendChild(guide);
            }
            guide.__rvTarget = g.target;
            const safeLabel = String(g.label).replace(/[&<>"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[char]);
            const html = '<span class="__review_guide_tag">' + GICON + '<span>' + safeLabel + ' · ' + g.notes.length + '</span></span>';
            if (guide.__rvHtml !== html) { guide.innerHTML = html; guide.__rvHtml = html; }
            guide.title = '点击“' + g.label + '”以显示 ' + g.notes.length + ' 处标注（' + g.notes.map(n => n.displayNumber).join(' ') + '）';
            guide.setAttribute('aria-label', guide.title);
            guide.style.left = left + 'px'; guide.style.top = top + 'px';
            guide.style.width = (right - left) + 'px'; guide.style.height = (bottom - top) + 'px';
            guide.classList.toggle('__review_guide_below', top < 24);            // 贴顶时标签改挂底边，不被视口切掉
            guide.classList.toggle('__review_guide_end', left + 84 > innerWidth); // 贴右时标签改挂右角
            alive.add(guide);
        });
        existing.forEach(x => { if (!alive.has(x)) x.remove(); });
        const orderKey = JSON.stringify(arranged.map(n => [n.id, n.displayNumber]));
        const staleKey = JSON.stringify(stale);
        if (orderKey !== lastOrder || staleKey !== lastStale || state !== lastState) {
            lastOrder = orderKey; lastStale = staleKey; lastState = state;
            R.onSync?.(Object.fromEntries(arranged.map(n => [n.id, n.displayNumber])), state, stale);
        }
    }

    document.addEventListener('proto-anchors:reveal-failed', layout);

    setInterval(() => {
        const html = document.documentElement.outerHTML.length;
        if (stateOf() !== lastState || scrollX !== lastX || scrollY !== lastY ||
            innerWidth !== lastW || innerHeight !== lastH || html !== lastHtml) {
            lastX = scrollX; lastY = scrollY; lastW = innerWidth; lastH = innerHeight; lastHtml = html;
            layout();
        }
    }, 350);

    layout();
})();

</script>
</body>
</html>
